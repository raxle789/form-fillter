<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Form Filler</title>
<style>
  :root {
    --paper:  #ECEDE8;
    --card:   #FFFFFF;
    --ink:    #14211C;
    --muted:  #6D7A73;
    --rule:   #D6D9D1;
    --accent: #0F5C43;
    --signal: #E8A33D;
    --danger: #A33A2A;

    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    width: 380px;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 11.5px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  button, select, textarea, input { font-family: inherit; color: inherit; }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--rule);
  }
  .caret {
    width: 3px;
    height: 15px;
    background: var(--signal);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  h1 {
    margin: 0;
    font: 600 13px/1 var(--mono);
    letter-spacing: -0.02em;
  }
  .host {
    margin-left: auto;
    max-width: 190px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font: 400 10.5px/1 var(--mono);
    color: var(--muted);
  }

  /* ---------- mode switch ---------- */
  .modes {
    display: flex;
    gap: 2px;
    margin: 12px 14px 0;
    padding: 2px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 6px;
  }
  .modes button {
    flex: 1;
    padding: 6px 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    font: 500 11px/1 var(--mono);
    color: var(--muted);
    cursor: pointer;
  }
  .modes button[aria-selected="true"] {
    background: var(--ink);
    color: var(--paper);
  }

  /* ---------- panels ---------- */
  .panel { padding: 12px 14px 0; }
  .panel[hidden] { display: none; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--rule);
  }
  .row:last-child { border-bottom: 0; }
  .row label { font: 400 11.5px/1.3 var(--sans); }
  .row .hint { display: block; color: var(--muted); font-size: 10.5px; }

  select {
    padding: 4px 6px;
    border: 1px solid var(--rule);
    border-radius: 5px;
    background: var(--card);
    font: 400 11px/1.4 var(--mono);
  }

  /* checkbox styled as a small switch-free square, keeps the form vocabulary */
  input[type="checkbox"] {
    appearance: none;
    width: 15px;
    height: 15px;
    margin: 0;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: var(--card);
    cursor: pointer;
    flex: none;
  }
  input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  input[type="checkbox"]:checked::after {
    content: "";
    display: block;
    width: 4px; height: 8px;
    margin: 1px auto 0;
    border: solid var(--card);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }

  textarea {
    width: 100%;
    min-height: 132px;
    padding: 9px 10px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: var(--card);
    font: 400 11px/1.55 var(--mono);
    resize: vertical;
    tab-size: 2;
  }
  textarea.invalid { border-color: var(--danger); }

  .meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 6px;
    min-height: 15px;
    font: 400 10.5px/1.4 var(--mono);
    color: var(--muted);
  }
  .meta .error { color: var(--danger); }

  .linkish {
    padding: 0;
    border: 0;
    background: none;
    font: 400 10.5px/1.4 var(--mono);
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .linkish[disabled] { color: var(--muted); text-decoration: none; cursor: default; }

  /* ---------- actions ---------- */
  .actions {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 6px;
    padding: 12px 14px;
  }
  .actions button {
    padding: 8px 12px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: var(--card);
    font: 500 11px/1 var(--mono);
    cursor: pointer;
  }
  .actions button:hover { border-color: var(--muted); }
  .actions button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .actions button.primary:hover { background: #0c4b37; }
  .actions button[disabled] { opacity: .5; cursor: default; }

  :focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }

  /* ---------- results ---------- */
  .status {
    display: block;
    padding: 0 14px 12px;
    font: 400 11px/1.5 var(--mono);
    color: var(--muted);
  }
  .status.error { color: var(--danger); }
  .status strong { color: var(--ink); font-weight: 600; }

  .results {
    max-height: 190px;
    overflow-y: auto;
    border-top: 1px solid var(--rule);
    background: var(--card);
  }
  .results:empty { display: none; }
  .field {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-bottom: 1px solid var(--rule);
  }
  .field:last-child { border-bottom: 0; }
  .field .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font: 400 11px/1.4 var(--mono);
  }
  .field .name span { display: block; color: var(--muted); font-size: 10px; }
  .field .tag {
    padding: 2px 6px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    font: 500 9.5px/1.4 var(--mono);
    color: var(--accent);
    text-transform: lowercase;
  }

  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
  }
</style>
</head>
<body>
  <header>
    <span class="caret" aria-hidden="true"></span>
    <h1>formfill</h1>
    <span class="host" id="host"></span>
  </header>

  <div class="modes" role="tablist">
    <button id="tab-auto" role="tab" aria-selected="true" aria-controls="panel-auto">Otomatis</button>
    <button id="tab-json" role="tab" aria-selected="false" aria-controls="panel-json">JSON</button>
  </div>

  <section class="panel" id="panel-auto" role="tabpanel" aria-labelledby="tab-auto">
    <div class="row">
      <label for="locale">Gaya data</label>
      <select id="locale">
        <option value="id">Indonesia</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="row">
      <label for="skipFilled">
        Lewati field yang sudah terisi
        <span class="hint">Berguna kalau kamu cuma mau menambal sisanya</span>
      </label>
      <input type="checkbox" id="skipFilled" checked>
    </div>
    <div class="row">
      <label for="highlight">
        Tandai field yang diisi
        <span class="hint">Kedip oranye sebentar di halaman</span>
      </label>
      <input type="checkbox" id="highlight" checked>
    </div>
  </section>

  <section class="panel" id="panel-json" role="tabpanel" aria-labelledby="tab-json" hidden>
    <textarea id="json" spellcheck="false" placeholder='{&#10;  "email": "fatih@example.com",&#10;  "user[first_name]": "Fatih",&#10;  "country": "ID",&#10;  "subscribe": true&#10;}'></textarea>
    <div class="meta">
      <span id="json-status">Key dicocokkan ke name, id, atau label.</span>
      <button class="linkish" id="template" disabled>Ambil dari hasil scan</button>
    </div>
  </section>

  <div class="actions">
    <button id="fill" class="primary">Isi form</button>
    <button id="scan">Scan</button>
    <button id="clear">Kosongkan</button>
  </div>

  <output class="status" id="status" role="status">Buka halaman berisi form, lalu tekan Isi form.</output>
  <div class="results" id="results"></div>

  <script src="popup.js"></script>
</body>
</html>
